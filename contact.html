<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Apex Fitness</title>
</head>
<body>
    <header>
        <h1>Contact Information</h1> 
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <p>
                    <label for="full-name">Name:</label><br>
                    <input type="text" id="full-name" name="full_name" required>
                </p>

                <p>
                    <label for="user-email">Email:</label><br>
                    <input type="email" id="user-email" name="user_email" required>
                </p>

                <p>
                    <label for="user-message">Message:</label><br>
                    <textarea id="user-message" name="user_message" rows="4" required></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p><small>&copy; 2026 Apex Fitness. All rights reserved.</small></p>
    </footer>
</body>
</html>
